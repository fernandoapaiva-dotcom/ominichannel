version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omini_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omini_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omini_password}
      POSTGRES_DB: ${POSTGRES_DB:-omini_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omini_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      default:
        aliases:
          - redis

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: omini_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - DOCKER_ENV=true
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API
      - CONFIG_SESSION_PHONE_NAME=Chrome
      # Database Config (PostgreSQL)

      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-omini_user}:${POSTGRES_PASSWORD:-omini_password}@postgres:5432/${POSTGRES_DB:-omini_db}
      - DATABASE_CLIENT_NAME=evolution_v2
      - DATABASE_CONNECTION_LIMIT=20

      # Cache Config (Redis)
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://omini_redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      # Authentication Config
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-omini_master_key_123}
      # Global Webhook Config (Points to FastAPI backend)
      # In OCI set WEBHOOK_BASE_URL=https://ominichannel.duckdns.org in .env
      - WEBHOOK_GLOBAL_URL=${WEBHOOK_BASE_URL:-http://host.docker.internal:8000}/api/v1/webhooks/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_SET=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=true
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
